name: Deploy GitHub Pages

# Deployt die statische Autemos-Doku (autemos.html + relative Assets) nach GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die das offizielle Pages-Deployment benötigt.
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Pages-Deployments vermeiden (laufendes nicht abbrechen).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          # Gesamten Doku-Inhalt nach _site kopieren (ohne Repo-/CI-Interna).
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='.idea' ./ _site/
          # GitHub Pages liefert standardmäßig index.html aus -> Einstiegspunkt bereitstellen.
          cp _site/autemos.html _site/index.html
          # Jekyll-Verarbeitung abschalten (statische Seite 1:1 ausliefern).
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
